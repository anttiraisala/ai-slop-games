<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upside-Down Roadster</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="overlay">
    <div id="panel">
      <h1 id="ov-title"></h1>
      <p id="ov-text"></p>
      <button id="ov-btn" type="button"></button>
    </div>
  </div>
  <div id="touch">
    <div class="side">
      <button type="button" data-key="left">&#9664;</button>
      <button type="button" data-key="right">&#9654;</button>
    </div>
    <div class="side">
      <button type="button" data-key="down">&#9660;</button>
      <button type="button" data-key="up">JET</button>
    </div>
  </div>
</div>
<script src="js/physics.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
