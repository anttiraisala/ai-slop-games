<!DOCTYPE html>
<html lang="en">
<head>

  <title>Banana Peel Ambush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>BANANA PEEL AMBUSH</h1>
    <canvas id="game" width="900" height="520"></canvas>
    <p class="help">
      <b>Arrows / WASD</b> move the peel &middot;
      <b>Hold still</b> to become invisible &middot;
      <b>P</b> pause &middot; <b>M</b> mute &middot;

    </p>
